name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Green Windows CI gates v1 (D-009, D-015, R-010).
    name: pipeline tests + dist sync + installer smoke (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run _shared script test suite
        working-directory: skills
        run: python -m unittest discover -s _shared/scripts/tests -v

      - name: Verify committed dist/ is in sync with skills/ source
        run: python build.py --check

      # Loader-level smoke (D-019): static imports mean any subcommand
      # loads the whole import graph, catching ESM conversion regressions.
      - name: CLI loader smoke on Node 22 (help + detect)
        run: |
          node cli/bin/treenail.js help
          node cli/bin/treenail.js detect

      - name: Installer smoke test (temp home)
        run: node cli/test/smoke-install.mjs

      # Rename integrity (T-037, R-020/R-021): no live old-name token
      # outside the immutable planning records and dated lore, and every
      # publishable name reads `treenail`. Keeps the T-036 sweep honest
      # over time; docs/release-gate.md documents the same two checks.
      - name: Old-name token gate + publishable-name assertions
        shell: bash
        run: |
          # pattern spelled k[e]el so this workflow doesn't match itself
          if git grep -I -n -i -e 'k[e]el' -- . \
              ':(exclude)docs/decisions' ':(exclude)docs/risks' \
              ':(exclude)docs/tasks' ':(exclude)docs/retrospectives' \
              ':(exclude)docs/spike-agent-degradation.md' \
              ':(exclude)docs/release-gate.md'; then
            echo "::error::live old-name token found outside records/lore (see matches above)"
            exit 1
          fi
          node cli/test/check-rename.mjs
